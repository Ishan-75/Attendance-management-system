<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Background Container for High Contrast & Mobile App Icon Compatibility -->
  <rect width="32" height="32" rx="7" fill="#0F172A" />

  <!-- Abstract Clock / Body Arc (Blue) -->
  <path d="M 10,23 C 10,16.5 12.5,13 16,13 C 19.5,13 22,16.5 22,23" 
        fill="none" 
        stroke="#2563EB" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- Employee Head Symbol (Blue) -->
  <circle cx="16" cy="8.5" r="2.5" fill="#2563EB" />

  <!-- Clock Center Needle Accent (Light Blue / White Glow) -->
  <line x1="16" y1="16" x2="16" y2="18.5" 
        stroke="#FFFFFF" 
        stroke-width="1.5" 
        stroke-linecap="round" />

  <!-- Verification Checkmark (Green Accent) -->
  <path d="M 8.5,18.5 L 13.5,23.5 L 23.5,10.5" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
