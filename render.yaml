services:
  - type: web
    name: attendance-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && alembic upgrade head && python -m app.db.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/attendance.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*","https://*.vercel.app"]'
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: attendancesystem55@gmail.com
      - key: SMTP_FROM_EMAIL
        value: attendancesystem55@gmail.com
      - key: SMTP_PASSWORD
        sync: false
